name: Validate Cold-Chain Project
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    if: vars.AWS_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install fastapi httpx pytest sqlglot python-dotenv boto3 botocore sqlalchemy pyodbc
      - run: python -m pytest -q tests
      - run: python -m compileall -q api src scripts
# Deployment is intentionally manual until infrastructure, secrets, identity and TLS are configured.
