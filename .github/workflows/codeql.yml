name: codeql

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # CodeQL code scanning is free for PUBLIC repositories only — on a free
    # plan it cannot run while this repository is private (live-found
    # 2026-11-22: the job 403s). Skip cleanly now; runs automatically at
    # the public-release gate.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
