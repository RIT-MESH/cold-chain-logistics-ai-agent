name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Direct binary run (the gitleaks-action wrapper mishandles the
      # root-commit range on fresh repositories: scanned 0 bytes and failed
      # on exit code — live-found 2026-11-22). Full-history git scan with
      # the repository's .gitleaks.toml.
      - name: Install gitleaks
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
