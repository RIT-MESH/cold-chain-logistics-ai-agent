name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The offline suite needs the agent package deps; pyodbc is NOT
      # installable headless for SQL Server driver reasons, so the
      # guard/validator/prefetch tests run with the lightweight subset.
      - run: pip install -r requirements.txt -r requirements-api.txt
      - name: Run offline test suite
        env:
          LLM_PROVIDER: NVIDIA_NIM
          NVIDIA_API_KEY: ci-placeholder-key
        run: pytest -q tests/
