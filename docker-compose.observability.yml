# Optional local Grafana service. Requires pre-existing SQL Server and provisioned read-only login.
services:
  grafana:
    image: grafana/grafana-oss:11.6.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      SQL_SERVER_HOST: ${SQL_SERVER_HOST:?Set SQL_SERVER_HOST}
      SQL_SERVER_PORT: ${SQL_SERVER_PORT:-1433}
      SQL_DATABASE: ${SQL_DATABASE:-ColdChainLogistics}
      SQL_AGENT_USER: ${SQL_AGENT_USER:?Set SQL_AGENT_USER}
      SQL_AGENT_PASSWORD: ${SQL_AGENT_PASSWORD:?Set SQL_AGENT_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./integrations/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./integrations/grafana/dashboards:/etc/grafana/dashboards:ro
volumes:
  grafana_data:
