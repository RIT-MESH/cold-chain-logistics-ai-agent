# Cold-Chain application stack (Phase 3a/3b) — blueprint 01 §5/§9, ADR-1/17.
# Runs ON the EC2 host. Secrets arrive ONLY via /run/coldchain/app.env
# (tmpfs, generated by docker/fetch-secrets.sh from Secrets Manager via the
# instance profile — C8/ADR-5: no secrets as build args, none in layers).
#
# ADR-17 enforced limits: gateway 1.5G / streamlit 1.5G / librechat 1G /
# mongodb 1G (WiredTiger capped 0.5G) / grafana 512M / nginx 128M. The
# worker ships DISABLED behind the "phase4" profile (Phase 4 deliverable).
#
# Port posture (Phase 3b): streamlit 8501 and nginx 8080 are ALB targets
# (sg-app allows ONLY sg-alb on these ports — the public IP is unreachable
# directly by SG). LibreChat and Grafana publish NO host ports (sidecar-only
# via the compose network). The gateway stays loopback + compose network.

name: coldchain

services:
  fde-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: fde-api
    env_file: /run/coldchain/app.env
    environment:
      # Phase 6 optimization (operator-approved 2026-11-17): deterministic
      # evidence pre-retrieval for recognized UC-xxxxxx incident+SOP
      # questions — the guarded SQL lookup + hardened SOP retrieval run
      # BEFORE the first NIM call (>= 3 model turns -> 1). Static env (not a
      # secret) so it survives fetch-secrets rolls. Rollback: "false" +
      # gateway restart.
      ENABLE_EVIDENCE_PREFETCH: "true"
      # Phase 6 operator decision (2026-11-17, after E2E3 timed out at the
      # 1500 s cap on GLM synthesis latency): the FINAL EVIDENCE-GROUNDED
      # SYNTHESIS TURN ONLY uses Nemotron Lightning (live-probed 1.0 s/turn;
      # tool-selection risks eliminated by the prefetch; fabricated/
      # misread-evidence answers rejected by the deterministic validator
      # in api/main.py). GLM remains the model for EVERYTHING else (ReAct
      # tool flow, all other questions). Rollback: remove this line +
      # gateway restart (GLM config untouched below — NVIDIA_MODEL in app.env).
      SYTHESIS_MODEL: "nvidia/nemotron-3.5-lightning-30b-a3b"
    restart: unless-stopped
    # Phase 5 (§8): gateway logs — including the structured audit lines from
    # src/audit.py — ship to the EXISTING /coldchain/dev/gateway CloudWatch
    # Logs group (Phase 1 tier, 90-day retention; the instance role already
    # holds logs:CreateLogStream/PutLogEvents on it). non-blocking mode +
    # 1 MB buffer: a CloudWatch hiccup can never stall the chat path; a full
    # buffer DROPS audit lines (honest limitation, stated in the report).
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /coldchain/dev/gateway
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: "1m"
    ports:
      - "127.0.0.1:8000:8000" # loopback + compose-network only — never public (01 §7.1)
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: streamlit
    env_file: /run/coldchain/app.env
    environment:
      # Public entry points on the U-4 CloudFront hostname (static config,
      # not secrets). LibreChat keeps its OWN login (01 §7.4); Grafana keeps
      # its own; both are iframed/linked from the dashboard.
      APP_PUBLIC_URL: "https://d36yix30egjffn.cloudfront.net"
      LIBRECHAT_PUBLIC_URL: "https://d36yix30egjffn.cloudfront.net/chat/"
      GRAFANA_PUBLIC_DASHBOARD_URL: "https://d36yix30egjffn.cloudfront.net/grafana/d/cold-chain-unified/unified-cold-chain"
      GRAFANA_PUBLIC_INCIDENT_URL: "https://d36yix30egjffn.cloudfront.net/grafana/d/cold-chain-incidents/telemetry-incidents"
    volumes:
      # Canonical dataset manifest for the Data Provenance tab — READ-ONLY
      # (live-found: the image copies only src/, so the manifest was missing
      # inside the container). Canonical file, never regenerated.
      - ./data/unified/DATASET_MANIFEST.json:/app/data/unified/DATASET_MANIFEST.json:ro
    restart: unless-stopped
    ports:
      - "8501:8501" # ALB target — sg-app allows sg-alb only (01 §3.1)
    mem_limit: 1536m
    cpus: 0.5
    depends_on:
      - fde-api

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    env_file: /run/coldchain/app.env
    environment:
      FDE_GATEWAY_URL: http://fde-api:8000/v1 # compose-network only (01 §7.1)
      MONGO_URI: mongodb://mongo:27017/LibreChat
      # Self-registration stays DISABLED: LibreChat is internet-reachable
      # via CloudFront with its own auth (01 §7.4). The operator account
      # was provisioned through a temporary window (live-found 2026-11-16:
      # this version gates registration ONLY on this env var — the yaml
      # registration block is NOT read by LibreChat 1.2.x).
      ALLOW_REGISTRATION: "false"
    volumes:
      - ./integrations/librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/assets/images
    restart: unless-stopped
    # NO host port: reachable only via the nginx sidecar (compose network)
    mem_limit: 1024m
    cpus: 0.5
    depends_on:
      - mongo
      - fde-api

  mongo:
    image: mongo:7
    container_name: mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"] # ADR-17 cap
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 0.5

  grafana:
    image: grafana/grafana-oss:11.6.1
    container_name: grafana
    env_file: /run/coldchain/app.env
    environment:
      # Sub-path serving under the single CloudFront hostname (U-4):
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # iframe embedding from the SAME origin (the Streamlit dashboard's
      # Grafana Monitoring section): without this, Grafana sends
      # X-Frame-Options: deny by default and the browser shows a broken
      # gray box (live-found 2026-11-16). Authentication is NOT relaxed —
      # the embedded page still requires the Grafana login.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./integrations/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./integrations/grafana/dashboards:/etc/grafana/dashboards:ro
      # Canonical AWS RDS global trust bundle (read-only) for SQL Server
      # TLS verification — pinned by the datasource's sslRootCertFile.
      - ./integrations/grafana/rds-global-bundle.pem:/etc/grafana/rds-global-bundle.pem:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    # NO host port: reachable only via the nginx sidecar (compose network)
    mem_limit: 512m
    cpus: 0.25

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    # LOGOUT: explicit flag (the env-var form of this slice option was not
    # honored live — sign_out rd= redirects to the Cognito hosted logout
    # domain were rejected with "domain / port not in whitelist" even with
    # OAUTH2_PROXY_WHITELIST_DOMAIN set; live-found 2026-11-16).
    command:
      - --whitelist-domain=coldchain-dev.auth.us-east-1.amazoncognito.com
    # OIDC gate for Streamlit (Phase 3b Option B): ALB -> 4180 -> streamlit.
    # LIVE-FOUND 2026-11-15: compose ${VAR} interpolation does NOT see
    # env_file values (it resolves from the shell at parse time) — mapping
    # ${COGNITO_CLIENT_ID} etc. here rendered them EMPTY and crash-looped
    # oauth2-proxy. The credential vars arrive via env_file directly under
    # their OAUTH2_PROXY_* names (see fetch-secrets.sh); ONLY static
    # settings are pinned here.
    env_file: /run/coldchain/app.env
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      # LIVE-FOUND 2026-11-16: the OIDC provider defaults to requesting
      # "openid email profile"; the Cognito app client permits ONLY
      # openid+email → Cognito rejects the authorize request with
      # error=invalid_scope (redirects to the callback with the error,
      # oauth2-proxy renders 403). Request exactly the allowed scopes.
      OAUTH2_PROXY_SCOPE: "openid email"
      # LIVE-FOUND 2026-11-15: the Cognito hosted-UI domain does NOT serve
      # /.well-known/openid-configuration (404) — OIDC discovery lives on
      # the cognito-idp endpoint (issuer = .../<pool-id>); discovery then
      # points authorize/token at the hosted-UI domain automatically.
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UwGkeVqC6"
      OAUTH2_PROXY_UPSTREAMS: "http://streamlit:8501"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      # LOGOUT: allow the sign_out rd= redirect to reach the Cognito hosted
      # logout domain (the Cognito session must be terminated too, not just
      # the oauth2-proxy cookie).
      OAUTH2_PROXY_WHITELIST_DOMAIN: "coldchain-dev.auth.us-east-1.amazoncognito.com"
    restart: unless-stopped
    ports:
      - "4180:4180" # ALB target: the authenticated gate (sg-alb only)
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      - streamlit

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    ports:
      - "8080:8080" # ALB target: /chat/* and /grafana/* rewrites (sg-alb only)
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      - librechat
      - grafana

  worker:
    build:
      context: .
      dockerfile: integrations/floci/Dockerfile.worker
    container_name: worker
    env_file: /run/coldchain/app.env
    # The worker image installs only dependencies (Dockerfile.worker copies
    # requirements-floci.txt); the application source arrives as a READ-ONLY
    # mount of the deployed tree (live-found 2026-11-17: without it the
    # containers crash-looped with ModuleNotFoundError 'src').
    volumes:
      - ./src:/workspace/src:ro
    # Static (non-secret) Phase 4 settings; queue/DLQ/topic and the SQL
    # writer identity arrive via app.env (fetch-secrets emits both).
    environment:
      TELEMETRY_THRESHOLD_C: "4.0"
      TELEMETRY_S3_PREFIX: "synthetic/"
    restart: unless-stopped
    profiles: ["phase4"] # activated when the SQS/SNS pipeline lands (Phase 4)
    mem_limit: 384m
    cpus: 0.25

  reconcile:
    # Scheduled notification reconciliation (blueprint 03 §B5): single loop
    # per host; sp_getapplock guards a manual concurrent run. Re-publishes
    # Class-B-lost notifications (append-only attempt rows only).
    build:
      context: .
      dockerfile: integrations/floci/Dockerfile.worker
    container_name: reconcile
    command: python -m src.telemetry.reconcile --loop
    env_file: /run/coldchain/app.env
    volumes:
      - ./src:/workspace/src:ro
    environment:
      RECONCILE_INTERVAL_SECONDS: "900"
      NOTIFY_BASE_INTERVAL_MINUTES: "15"
      NOTIFY_MAX_ATTEMPTS: "5"
      NOTIFY_ATTEMPT_WINDOW_H: "24"
      NOTIFY_PENDING_ALARM_MINUTES: "30"
    restart: unless-stopped
    profiles: ["phase4"]
    mem_limit: 256m
    cpus: 0.25

volumes:
  mongo_data:
  grafana_data:
  librechat_images:
