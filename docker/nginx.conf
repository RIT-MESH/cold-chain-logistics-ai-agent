# nginx sidecar — sub-path router for the CloudFront single-hostname design
# (U-4: no custom domain). The ALB forwards /chat/* and /grafana/* here;
# nginx strips the /chat prefix for LibreChat (which cannot serve under a
# sub-path) and passes /grafana/* through unchanged (Grafana serves its own
# sub-path via GF_SERVER_SERVE_FROM_SUB_PATH). Websocket upgrades proxied.

server {
  listen 8080;

  # ALB target-group health probe (listener rule forwards /chat/* with the
  # origin-secret header; the ALB health checker does NOT send custom
  # headers, so the probe must answer before the location blocks below).
  location = /chat/healthz {
    return 200 "ok\n";
  }

  # LibreChat: strip the /chat prefix (trailing slash on proxy_pass).
  # LIVE-FOUND 2026-11-16 (blank white page): LibreChat's index.html has
  # <base href="/" />, so its RELATIVE asset URLs resolve to /assets/* at
  # the CloudFront ROOT — which the default ALB behavior 403s (only /chat/*
  # is routed here). Rewriting the base tag to /chat/ makes both the
  # assets AND the app's API calls (axios baseURL is EMPTY = relative to
  # the document base) resolve under the routed prefix.
  location /chat/ {
    proxy_pass http://librechat:3080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # sub_filter requires uncompressed upstream responses:
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '<base href="/" />' '<base href="/chat/" />';
    proxy_read_timeout 300;
  }

  # Grafana: pass the path AS-IS (sub-path served by Grafana itself).
  location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300;
  }

  location / {
    return 404 "{\"error\":\"not routed\"}\n";
  }
}
